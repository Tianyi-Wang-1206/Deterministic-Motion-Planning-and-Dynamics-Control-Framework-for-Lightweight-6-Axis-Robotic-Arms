# Lite6 physical limits
joint_limits:
  joint1: { max_vel: 3.14, max_acc: 3.5, min_pos: -6.28319, max_pos: 6.28319 }
  joint2: { max_vel: 3.14, max_acc: 2.5, min_pos: -2.61799, max_pos: 2.61799 }
  joint3: { max_vel: 3.14, max_acc: 4.0, min_pos:  0.00000, max_pos: 4.97419 }
  joint4: { max_vel: 3.14, max_acc: 8.0, min_pos: -6.28319, max_pos: 6.28319 }
  joint5: { max_vel: 3.14, max_acc: 8.0, min_pos: -1.62316, max_pos: 1.62316 }
  joint6: { max_vel: 3.14, max_acc: 10.0, min_pos: -6.28319, max_pos: 6.28319 }

cartesian_limits:
  max_trans_vel: 1.0     # m/s
  max_trans_acc: 3.0     # m/s^2
  max_rot_vel: 2.5       # rad/s
  max_rot_acc: 5.0       # rad/s^2

# Singularity threshold
singularity_threshold: 0.001
# Quadrant jump detection threshold (Maximum allowed jump between two points on a single axis, in radians)
quadrant_jump_threshold: 0.5